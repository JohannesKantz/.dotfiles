#? Config file for btop v. 1.4.0

# Use the terminal's own background color instead of the theme background
theme_background = False

# Update interval in milliseconds
update_ms = 2000

# Sort processes by: "pid", "program", "arguments", "threads", "user", "memory", "cpu lazy", "cpu direct"
proc_sorting = "cpu lazy"

# Show processes as a tree
proc_tree = False

# Use vim-style keybindings (h/j/k/l)
vim_keys = True

# Show CPU temperature
check_temp = True

# Which network interface to show by default (auto = first non-loopback)
net_iface = "auto"

# Show a mini graph of disk read/write in the disk section
show_disks = True
only_physical = True
