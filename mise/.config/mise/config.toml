# Mise global configuration
# https://mise.jdx.dev/configuration.html

[settings]
# Automatically install tools when switching into a project directory
auto_install = true

# Warn when a .tool-versions or .mise.toml file is found in a parent directory
# but no matching tool is installed
not_found_auto_install = true

[tools]
# Global default tool versions — override per-project with a local .mise.toml
# Uncomment and set the versions you want available everywhere.
node = "lts"
# python = "latest"
# rust = "stable"
# go = "latest"
# bun = "latest"
