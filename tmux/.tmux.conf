################
#  TERMINAL    #
################

set -g default-terminal "tmux-256color"
# Enable true colors and modified keys such as Shift+Enter in modern terminals.
set -as terminal-features ',xterm*:RGB'
set -as terminal-features ',xterm*:extkeys'
set -g allow-passthrough on
set -s extended-keys on
set -g focus-events on

#############
#  OPTIONS  #
#############

set -g mouse on
# Remove the delay after pressing Escape, which makes Vim feel more responsive.
set -s escape-time 0
set -g history-limit 50000
set -g display-time 3000
set -g status-interval 5
setw -g mode-keys vi

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Name idle windows after their folder and busy windows after the running program.
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},#{b:default-shell}},#{b:pane_current_path},#{pane_current_command}}'

############
#  PREFIX  #
############

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

#################
#  KEYBINDINGS  #
#################

bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Move the current window left or right.
bind -r '<' swap-window -d -t -1
bind -r '>' swap-window -d -t +1

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Hold the key after the prefix to resize repeatedly.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch panes directly without pressing the prefix first.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

#############
#  PLUGINS  #
#############

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
# Keep inactive window names shorter than the active window name.
set -g @catppuccin_window_text ' #{=/18/...:window_name}'
set -g @catppuccin_window_current_text ' #{=/24/...:window_name}'

set -g status-left ''
set -g status-right-length 100
set -g status-right '#{E:@catppuccin_status_application}'
set -ag status-right '#{E:@catppuccin_status_session}'

# TPM installs plugins into this folder.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
# Navigate seamlessly between tmux panes and Vim splits with Ctrl+h/j/k/l.
set -g @plugin 'christoomey/vim-tmux-navigator'
# Save and restore sessions, windows, panes, and working directories.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Install TPM and all configured plugins automatically on a new machine.
if-shell "test ! -d ~/.tmux/plugins/tpm" "run-shell 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
