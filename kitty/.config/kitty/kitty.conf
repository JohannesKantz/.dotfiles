# vim:fileencoding=utf-8:ft=conf:foldmethod=marker


term xterm-kitty
#term xterm-256color

update_check_interval 0

enable_audio_bell       no
visual_bell_duration    0.0
visual_bell_color       none

repaint_delay           10
input_delay             3
sync_to_monitor         yes



## Font  in pts
font_size           20.0

font_family         Fira Code
bold_font           auto
italic_font         auto
bold_italic_font    auto

adjust_line_height  104%

## Cursor
cursor_shape                block
shell_integration           no-cursor

cursor_blink_interval       0.0
cursor_stop_blinking_after  0.0


## Mouse
wheel_scroll_multiplier 1.0

url_style   single
detect_urls yes


## Scrollback
scrollback_pager less -S -R +G
scrollback_lines 2000


## Window
remember_window_size    yes
initial_window_width    640
initial_window_height   480

window_margin_width     0
window_margin_height    0
window_padding_width    10
window_padding_height   10
hide_window_decorations no


## Layout
# https://sw.kovidgoyal.net/kitty/overview/#layouts
# https://sw.kovidgoyal.net/kitty/layouts/
# ┌──────────────┬───────────────┐
# │              │               │
# │              │               │
# │              │               │
# │              ├───────────────┤
# │              │               │
# │              │               │
# │              │               │
# │              ├───────────────┤
# │              │               │
# │              │               │
# │              │               │
# └──────────────┴───────────────┘

enabled_layouts tall:bias=50;full_size=1;mirrored=false,grid,fat,stack


## Tab bar
tab_bar_min_tabs    2
tab_bar_position    bottom
tab_bar_style       fade
tab_title_template  {index}: {title}


## Themes
# https://github.com/kovidgoyal/kitty-themes
# https://github.com/dexpota/kitty-themes

include themes/gruvbox_dark.conf
#include themes/OneHalfDark.conf


## Key bindings

# alt + number to switch tabs
map alt+1       goto_tab 1
map alt+2       goto_tab 2
map alt+3       goto_tab 3
map alt+4       goto_tab 4
map alt+5       goto_tab 5
map alt+6       goto_tab 6
map alt+7       goto_tab 7
map alt+8       goto_tab 8
map alt+9       goto_tab 9
map alt+0       goto_tab 10

# kitty_mod + number to switch windows
map kitty_mod+1 first_window
map kitty_mod+2 second_window
map kitty_mod+3 third_window
map kitty_mod+4 fourth_window
map kitty_mod+5 fifth_window
map kitty_mod+6 sixth_window
map kitty_mod+7 seventh_window
map kitty_mod+8 eighth_window
map kitty_mod+9 ninth_window
map kitty_mod+0 tenth_window


